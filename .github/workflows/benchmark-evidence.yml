name: Benchmark evidence

on:
  pull_request:
    paths:
      - 'benchmark/**'
      - '.github/workflows/benchmark-evidence.yml'
  push:
    branches: [main]
    paths:
      - 'benchmark/**'
      - '.github/workflows/benchmark-evidence.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test trace measurements
        run: python3 -m unittest discover -s benchmark/tests -v
      - name: Verify canonical evidence
        run: python3 benchmark/tools/recompute.py --check
